<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <h1>Basic Calculator</h1>
        <p class="subtitle">Kalkulator Aritmatika Sederhana</p>

        <div class="form-group">
            <label for="angka1">Input 1</label>
            <input type="number" id="angka1" placeholder="Masukkan angka pertama">
        </div>

        <div class="form-group">
            <label for="operator">Operator</label>
            <select id="operator">
                <option value="+">Penjumlahan (+)</option>
                <option value="-">Pengurangan (-)</option>
                <option value="*">Perkalian (*)</option>
                <option value="/">Pembagian (/)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="angka2">Input 2</label>
            <input type="number" id="angka2" placeholder="Masukkan angka kedua">
        </div>

        <button onclick="hitung()">Hitung</button>

        <div class="hasil">
            <h2>Hasil</h2>
            <p id="hasil">-</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
